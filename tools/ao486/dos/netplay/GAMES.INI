; Network games for the ao486 netplay menu (NPMENU.EXE).
;
; One section per game. The menu looks for the game's files on every hard
; disk (three folders deep) and lists it if they are there.
;
;   find=     files that identify the game (all in the same folder)
;   need=     files that network play needs as well; A|B means either one
;   type=     ipx      the game's own IPX starter takes the players on its
;                      command line (IPXSETUP): the menu asks for them
;             program  the game sets up network play in its own menus or in
;                      its SETUP program: the menu starts it and shows how
;             fpu      the game needs a maths coprocessor, which the ao486
;                      does not have: listed, not started
;   run=      what to start, in the game's folder; A|B: the first that exists
;   args=     command line (type ipx): %N players, %M the mode's switches,
;             %S skill 1-5
;   modes=    Name=switches|Name=switches   (type ipx)
;   players=  the most players (type ipx), 2 if missing
;   hint=     a line shown before the game starts (several allowed)
;
; Everything here except Doom is untested on the ao486. File names come from
; the DOS releases; a game installed under other names is simply not found.
; Add your own: a new section is enough.

[Doom II]
find=DOOM2.WAD
need=IPXSETUP.EXE DOOM2.EXE|DOOM.EXE
type=ipx
run=IPXSETUP.EXE
args=-nodes %N %M -skill %S
modes=Co-op=|Deathmatch=-deathmatch|Deathmatch 2.0=-altdeath
players=4
hint=Everyone picks the same game here; player 1's settings are used.
hint=FastDoom (FDOOM.EXE) has no network play: it needs id's DOOM2.EXE
hint=(or DOOM.EXE 1.9) and IPXSETUP.EXE in the same folder as DOOM2.WAD.

